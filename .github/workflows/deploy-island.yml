# Deploys Island Company to Firebase (islandgame-efc37): the web app to Hosting
# and firestore.rules. Runs on pushes that touch the game, or by hand.
# Needs one repo secret, FIREBASE_SERVICE_ACCOUNT (a service-account JSON key
# with the "Firebase Admin" role). Without it the deploy steps are skipped.
name: Deploy island
on:
  push:
    branches: [main, claude/jolly-keller-gy5hs4]
    paths: ['island-company/**', '.github/workflows/deploy-island.yml']
  workflow_dispatch:

concurrency:
  group: deploy-island
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: island-company
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: island-company/package-lock.json
      - run: npm ci
      - run: npm test
      - id: build
        run: npm run build
      - name: No deploy key yet
        if: env.HAS_KEY != 'true'
        run: echo "::notice::Add the FIREBASE_SERVICE_ACCOUNT repo secret to enable deploys. Build and tests passed."
      - uses: google-github-actions/auth@v2
        if: env.HAS_KEY == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      # Separate steps: the site goes live even if the rules step is refused,
      # and each failure names the permission it lacks.
      # Service-account roles needed: Firebase Hosting Admin, Firebase Rules Admin,
      # Service Usage Consumer (or Firebase Admin + Service Usage Consumer).
      - name: Deploy the website (Firebase Hosting)
        if: env.HAS_KEY == 'true'
        run: npx --yes firebase-tools@15 deploy --only hosting --project islandgame-efc37 --non-interactive
      - name: Deploy Firestore security rules
        if: env.HAS_KEY == 'true' && !cancelled() && steps.build.outcome == 'success'
        run: npx --yes firebase-tools@15 deploy --only firestore:rules --project islandgame-efc37 --non-interactive
