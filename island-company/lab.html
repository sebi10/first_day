<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Puzzle Lab</title>
    <style>
      html, body { margin: 0; height: 100%; background: #F2E3C6; font-family: system-ui, sans-serif; color: #1F2A30; }
      #bar { height: 6px; background: #2E7C93; transform-origin: left; }
      #top { display: flex; justify-content: space-between; padding: 8px 12px; font-size: 13px; }
      #stage { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; }
      #res { position: fixed; left: 12px; right: 12px; bottom: 12px; background: #1F2A30; color: #fff; padding: 12px; border-radius: 12px; display: none; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="top"><span id="title"></span><span id="status"></span></div>
    <div id="stage"></div>
    <div id="res"></div>
    <script type="module" src="/src/lab.ts"></script>
  </body>
</html>
